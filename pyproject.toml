[project]
name = "medil"
version = "2.0.0"
description = "MeDIL is a Python package for causal factor analysis with the (me)asurement (d)ependence (i)nducing (l)atent causal model framework."
keywords = ["factor analysis", "causal representation learning"]
readme = "README.md"
license = {file = "LICENSE.md"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.3",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.1",
    "torch>=2.5.1",
    "tqdm>=4.67.1",
]

[project.urls]
documentation = "https://medil.causal.dev"
repository = "https://gitlab.com/alex-markham/medil"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "sempler>=0.2.13",
    "torchvision>=0.20.1",
    "ipython>=8.32.0",
    "snakemake>=9.21.0",
    "snakefmt>=1.1.0",
    "causalchamber>=0.2.8",
    "dcor>=0.7",
]

[tool.uv]
cache-dir = "./.uv_cache"

