pytest:
  image: continuumio/miniconda3
  stage: test
  script:
    - conda update conda
    - conda install pip
    - pip install pytest-cov ".[ncfa]"
    - python -m pytest --cov-report html --cov-report xml:coverage.xml --cov-report term --cov=medil
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pages:
  image: alpine
  stage: deploy
  needs:
    - job: pytest
      artifacts: true
  script:
    - apk add make py3-pip python3-dev
    - python3 -m venv .
    - . bin/activate
    - pip install setuptools sphinx sphinx-rtd-theme sphinx-mdinclude sphinxcontrib-bibtex
    - cd docs
    - make html
    - cd ..
    - mv docs/_build/html/ public/
    - mv htmlcov/ public/
  artifacts:
    paths:
    - public
