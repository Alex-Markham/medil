pages:
  image: alpine
  stage: deploy
  script:
    - apk add make curl unzip py3-pip python3-dev
    - python3 -m venv .
    - . bin/activate
    - pip install setuptools sphinx sphinx-rtd-theme sphinx-mdinclude sphinxcontrib-bibtex
    - cd docs
    - make html
    - cd ..
    - mv docs/_build/html/ public/
    - 'curl -L --output artifacts.zip --header "PRIVATE-TOKEN: glpat-ZLYbTK5vzSiSizWtAi3V" "https://gitlab.com/api/v4/projects/14696396/jobs/artifacts/develop/download?job=pytest"'
    - unzip artifacts.zip
    - mv htmlcov/ public/
  artifacts:
    paths:
    - public
